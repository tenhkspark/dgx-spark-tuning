// Security-only unattended upgrades, with the kernel, NVIDIA stack, Docker and every
// firmware path held back. Install as /etc/apt/apt.conf.d/52-security-only.conf.
//
// After changing this file, prove it: systemctl start apt-daily-upgrade, then read
// /var/log/unattended-upgrades/unattended-upgrades.log.
#clear Unattended-Upgrade::Allowed-Origins;
Unattended-Upgrade::Allowed-Origins {
    "${distro_id}:${distro_codename}-security";
    "${distro_id}ESM:${distro_codename}-infra-security";
    "${distro_id}ESMApps:${distro_codename}-apps-security";
};
Unattended-Upgrade::Package-Blacklist {
    "linux-.*";
    ".*nvidia.*";
    "cuda-.*";
    "libcuda.*";
    "docker.*";
    "containerd.*";
    "dkms";
    "fwupd.*";
    "linux-firmware";
    "dgx-spark-ota-update-meta";
    "firmware-.*";
    ".*-firmware.*";
};
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
Unattended-Upgrade::Remove-Unused-Dependencies "false";
