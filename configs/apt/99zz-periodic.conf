// Re-enable the daily periodic update job. NVIDIA's 99update-notifier-nvidia sets both
// of these to "0", and apt.conf.d is read in lexical order, so an earlier file loses.
// This file sorts after every 99* file and survives driver upgrades (which rewrite
// NVIDIA's copy but never this one). Install as /etc/apt/apt.conf.d/99zz-periodic.conf.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
